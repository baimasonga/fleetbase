# Railway service: scheduler (runs `php artisan schedule:run` every minute). Same image as api.
# Config-as-code file: /railway/scheduler.toml. Root directory: empty.

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile"
watchPatterns = ["api/**", "packages/pod/**", "docker/**", "railway/scheduler.toml"]

[deploy]
startCommand = "go-crond --verbose root:./crontab"
restartPolicyType = "ALWAYS"
