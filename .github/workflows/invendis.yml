name: Invendis

# Checks for the Invendis extension (packages/pod) and the image Railway builds
# from this repository. With Railway's "Wait for CI" setting on, a push is only
# deployed once these pass.

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'packages/pod/**'
      - 'api/composer.json'
      - 'api/composer.lock'
      - 'docker/**'
      - 'railway/**'
      - '.railway/**'
      - '.github/workflows/invendis.yml'
  pull_request:
    paths:
      - 'packages/pod/**'
      - 'api/composer.json'
      - 'api/composer.lock'
      - 'docker/**'
      - 'railway/**'
      - '.railway/**'
      - '.github/workflows/invendis.yml'

permissions:
  contents: read

concurrency:
  group: invendis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit, integration and field app tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POD_TEST_VENDOR: ${{ github.workspace }}/.pod-test/vendor

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, gd, zip, intl, bcmath, sqlite3, pdo_sqlite, fileinfo
          coverage: none

      - name: Install the test dependencies (no Fleetbase install needed)
        # A throwaway vendor folder for the tests, never deployed. Fleetbase is on
        # Laravel 10, which is out of support: every 10.x release has open advisories,
        # and Composer refuses them by default, so they are allowed here only.
        env:
          COMPOSER_NO_SECURITY_BLOCKING: '1'
        run: |
          mkdir -p .pod-test && cd .pod-test
          echo '{"minimum-stability":"stable","config":{"audit":{"block-insecure":false},"policy":{"advisories":{"block":false}}}}' > composer.json
          composer require --no-interaction --no-progress \
            giggsey/libphonenumber-for-php:^8.13 phpoffice/phpspreadsheet:^1.28 milon/barcode:^10.0 \
            dompdf/dompdf:^3.1 vlucas/phpdotenv:^5.6 orchestra/testbench:^8.0 phpunit/phpunit:^10.5

      - name: Unit tests
        working-directory: packages/pod
        run: php "$POD_TEST_VENDOR/bin/phpunit"

      - name: Integration tests
        working-directory: packages/pod
        run: php "$POD_TEST_VENDOR/bin/phpunit" -c phpunit.integration.xml.dist

      - name: Field app syntax
        run: for f in packages/pod/field-app/js/*.js packages/pod/field-app/sw.js; do node --check "$f"; done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        working-directory: packages/pod/server/tests/FieldApp
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends python3-pil

      - name: Field app end to end (offline day, two phones, supervisor review)
        working-directory: packages/pod/server/tests/FieldApp
        env:
          POD_E2E_DIR: ${{ runner.temp }}/pod-e2e
        run: ./run.sh

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-app-screenshots
          path: ${{ runner.temp }}/pod-e2e/shots
          if-no-files-found: ignore

  railway-config:
    name: Railway config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Infrastructure as Code type-checks against Railway's SDK and describes the project
        run: |
          npm ci --prefix .railway --no-audit --no-fund
          .railway/node_modules/.bin/tsc -p .railway --noEmit false --outDir .railway/.out
          node .railway/check.mjs
      - name: Scripts are valid
        run: |
          sh -n railway/console-config.sh
          sh -n railway/generate-secrets.sh
      - name: Console config script writes valid JSON
        run: |
          dir=$(mktemp -d)
          sed "s#/usr/share/nginx/html#$dir#" railway/console-config.sh > "$dir/run.sh"
          API_HOST=https://api.example.org SOCKETCLUSTER_HOST=socket.example.org sh "$dir/run.sh"
          python3 -m json.tool "$dir/fleetbase.config.json"

  api-image:
    name: API image builds (what Railway deploys)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build docker/Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: invendis-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Invendis is installed in the image
        run: |
          docker run --rm --entrypoint sh invendis-api:ci -c 'set -e
            test -f vendor/fleetbase/pod-api/server/src/Auth/Schemas/Pod.php
            test -f vendor/fleetbase/pod-api/field-app/index.html
            test -f vendor/fleetbase/pod-api/server/data/seed/sierra-leone/admin-areas.csv
            test ! -L vendor/fleetbase/pod-api
            echo "Invendis files are in the image (copied, not linked)"
            for m in storefront-api ledger-api customer-portal-api; do
              if [ -e "vendor/fleetbase/$m" ]; then echo "fleetbase/$m should not be installed"; exit 1; fi
            done
            echo "No storefront, ledger or customer portal"'
          docker run --rm --entrypoint php invendis-api:ci -r 'require "vendor/autoload.php"; exit(class_exists("Fleetbase\\Pod\\Providers\\PodServiceProvider") && class_exists("Fleetbase\\Pod\\Auth\\Schemas\\Pod") ? 0 : 1);'

  api-starts:
    name: API image starts and serves (as on Railway)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0-oracle
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: railway
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build docker/Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: invendis-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Railway's variables, with stand-in secrets
        run: |
          {
            echo "APP_NAME=Invendis"
            echo "APP_ENV=production"
            echo "APP_DEBUG=false"
            echo "APP_KEY=base64:$(openssl rand -base64 32)"
            echo "LOG_CHANNEL=stdout"
            echo "TRUSTED_PROXIES=*"
            echo "PORT=8000"
            echo "DATABASE_URL=mysql://root:ci-root@127.0.0.1:3306/railway"
            echo "DB_PORT=3306"
            echo "CACHE_URL=redis://127.0.0.1:6379"
            echo "REDIS_URL=redis://127.0.0.1:6379"
            echo "REDIS_PORT=6379"
            echo "QUEUE_CONNECTION=redis"
            echo "CACHE_DRIVER=redis"
            echo "CACHE_PATH=/fleetbase/api/storage/framework/cache"
            echo "APP_URL=http://localhost:8000"
            echo "SESSION_DOMAIN=localhost"
            echo "BROADCAST_DRIVER=log"
            echo "REGISTRY_HOST=https://registry.fleetbase.io"
            echo "REGISTRY_PREINSTALLED_EXTENSIONS=true"
            echo "OSRM_HOST=https://router.project-osrm.org"
            echo "MAIL_MAILER=log"
            echo "POD_GUARD_MODE=log"
            echo "POD_DEFAULT_COUNTRY=SL"
            echo "POD_CARD_SECRET=$(openssl rand -base64 48)"
            echo "POD_ID_HASH_KEY=$(openssl rand -base64 48)"
            echo "POD_ADMIN_EMAIL=admin@example.org"
            echo "POD_ADMIN_PASSWORD=Ci-Admin-Password-2027!"
          } > railway.env

      - name: Pre-deploy step (the api's preDeployCommand)
        run: |
          docker run --rm --network host --env-file railway.env --entrypoint sh invendis-api:ci -c "./deploy.sh && php artisan pod:seed-admin-areas SL && php artisan pod:create-admin --no-interaction"

      - name: Start the server with the api's start command
        run: |
          docker run -d --name api --network host --env-file railway.env -v "$PWD/ci-storage:/fleetbase/api/storage/app" --entrypoint sh invendis-api:ci \
            -c 'exec php artisan octane:frankenphp --max-requests=1000 --host=0.0.0.0 --port=${PORT:-8000}'
          for i in $(seq 1 40); do
            if curl -fsS --max-time 5 http://localhost:8000/health >/dev/null 2>&1 && curl -fsS --max-time 5 http://localhost:8000/pod-field/ | grep -q '<title>Invendis</title>'; then
              echo "The API answers /health and serves the field app at /pod-field/."; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' api)" != "true" ]; then echo "The server stopped."; break; fi
            sleep 3
          done
          echo "::error::The API did not start serving"
          exit 1

      - name: A malformed APP_KEY breaks the workers as on Railway, and the pre-deploy check names it
        run: |
          docker rm -f api >/dev/null 2>&1 || true
          sed 's/^APP_KEY=.*/APP_KEY=base64/' railway.env > bad-key.env
          # The server alone only says "worker script has failed"...
          docker run -d --name api-bad --network host --env-file bad-key.env -e PORT=8001 --entrypoint sh invendis-api:ci \
            -c 'exec php artisan octane:frankenphp --max-requests=1000 --host=0.0.0.0 --port=8001'
          sleep 20
          docker logs api-bad 2>&1 | grep -v "PHP Deprecated" | tail -15
          if curl -fsS --max-time 5 http://localhost:8001/health >/dev/null 2>&1; then echo "::error::the server started with a malformed APP_KEY"; exit 1; fi
          # ...while the pre-deploy check stops the deploy and says why.
          if docker run --rm --network host --env-file bad-key.env --entrypoint php invendis-api:ci artisan pod:check-runtime > check.txt 2>&1; then
            cat check.txt; echo "::error::pod:check-runtime passed with a malformed APP_KEY"; exit 1
          fi
          cat check.txt
          grep -q "APP_KEY is not valid" check.txt

      - name: Why it did not start
        if: failure()
        run: |
          echo "===== server log ====="; docker logs api 2>&1 | grep -v "PHP Deprecated" | tail -80 || true
          echo "===== booting the app the way an Octane worker does, outside FrankenPHP ====="
          docker run --rm --network host --env-file railway.env --entrypoint php invendis-api:ci -d display_errors=1 -r '
            require "vendor/autoload.php";
            try {
              (new Laravel\Octane\ApplicationFactory("/fleetbase/api"))->createApplication();
              echo "BOOT OK\n";
            } catch (Throwable $e) {
              echo get_class($e), ": ", $e->getMessage(), "\n  in ", $e->getFile(), ":", $e->getLine(), "\n", $e->getTraceAsString(), "\n";
              exit(1);
            }' || true
